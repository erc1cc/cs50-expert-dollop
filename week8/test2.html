<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown with Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    details {
      margin: 20px 0;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 6px;
      max-width: 400px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1em;
    }

    ol {
      margin-top: 10px;
      padding-left: 20px;
    }

    a {
      color: #0077cc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>📚 Learning Topics</h1>

  <details>
    <summary>Click to view topics and descriptions</summary>
    <p>Here’s a list of topics you can explore, each linking to its own page.</p>
    <ol>
      <li><a href="html.html">Learn HTML</a></li>
      <li><a href="css.html">Master CSS</a></li>
      <li><a href="javascript.html">Explore JavaScript</a></li>
    </ol>
  </details>

</body>
</html>
